<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 170 510 420" width="510" height="420" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.6" stop-color="#060d20"/>
      <stop offset="1" stop-color="#03060f"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d6e2f5"/>
      <stop offset="1" stop-color="#8fa6cc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#1457ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background + frame -->

  <!-- Blue slash behind monogram -->
  <path d="M150 560 L560 190 L610 190 L200 560 Z" fill="url(#blue)" opacity="0.9" filter="url(#glow)"/>

  <!-- RM monogram (chrome) -->
  <g fill="none" stroke="url(#chrome)" stroke-width="56" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="8">
    <path d="M222 520 V252 H332 L372 292 V352 L332 392 H222"/>
    <path d="M322 392 L384 520"/>
    <path d="M462 520 V252 L542 372 L622 252 V520"/>
  </g>

  <!-- Play triangle in the M -->
  <path d="M520 410 L520 470 L568 440 Z" fill="url(#blue)" filter="url(#glow)"/>
</svg>
